# New brand template. Claude fills this in by researching the brand's website/socials (see CLAUDE.md §1).
name: Brand Name
slug: brand-slug
website: https://example.com
url: example.com
handle: "@brand"
tagline: ""
descriptor: ""            # e.g. "SERVICE  ·  SERVICE  ·  SERVICE"
positioning: ""

colors:
  bg: "#0b1c30"           # dominant background (dark or light)
  surface: "#1d3a5c"      # secondary shape color
  accent: "#ffb63d"       # the one color that pops
  text: "#ecf2fa"
  muted: "#8fa3bd"

fonts:
  heading: shared/fonts/Poppins-Bold.ttf
  body: shared/fonts/Poppins-Light.ttf
logo: null                # e.g. assets/logo.svg
assets: []                # [{url: "...", save_as: assets/logo.png}]

style:
  dot_grid: true
  motion: ""              # words describing how this brand moves
  visual_language: ""     # recurring shapes/imagery

messages: {}              # reusable copy: taglines, beliefs, services, stats, process steps...

music:
  style: "calm minimal ambient electronic, no vocals"
  bpm: 90
voice:
  tone: ""
  kokoro: {voice: af_heart, speed: 1.0}

defaults:
  format: {preset: feed_4x5}
  style: {preset: precise, energy: medium}
  audio: {music: synth, sfx: yes, voiceover: none, voice: am_michael}
  storyboard: "no"
  cta: "{url}"
